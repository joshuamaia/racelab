spring:
  application:
    name: racelab-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${RACELAB_DB_URL:jdbc:postgresql://localhost:5432/racelab?ApplicationName=racelab-backend}
    username: ${RACELAB_DB_USER:racelab_app}
    password: ${RACELAB_DB_PASSWORD:racelab_app}
    hikari:
      pool-name: racelab-pool
      maximum-pool-size: ${RACELAB_DB_POOL_SIZE:60}
      minimum-idle: 5
      connection-timeout: 5000
      max-lifetime: 1800000
  flyway:
    enabled: true
    user: ${RACELAB_DB_MIGRATION_USER:${RACELAB_DB_USER:racelab_app}}
    password: ${RACELAB_DB_MIGRATION_PASSWORD:${RACELAB_DB_PASSWORD:racelab_app}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${RACELAB_REDIS_HOST:localhost}
      port: ${RACELAB_REDIS_PORT:6379}
      timeout: 1000ms
      connect-timeout: 1000ms
  mvc:
    async:
      request-timeout: 3600000

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    max-swallow-size: 64KB
    threads:
      max: 200

racelab:
  version: 1.0.0
  instance-id: ${RACELAB_INSTANCE_ID:primary}
  self-url: ${RACELAB_SELF_URL:http://localhost:8080}
  internal-token: ${RACELAB_INTERNAL_TOKEN:local-demo-internal-token}
  peer:
    url: ${RACELAB_PEER_URL:}
    instance-id: ${RACELAB_PEER_INSTANCE_ID:secondary}
  limits:
    max-concurrent-experiments: ${RACELAB_MAX_CONCURRENT_EXPERIMENTS:3}
    max-body-bytes: 65536
    mutations-per-minute: ${RACELAB_MUTATIONS_PER_MINUTE:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: true
  metrics:
    tags:
      application: racelab-backend
      instance: ${racelab.instance-id}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html
  paths-to-match: /api/**

logging:
  pattern:
    correlation: "[exp=%X{experimentId:-} tx=%X{transactionId:-} worker=%X{workerId:-} cid=%X{correlationId:-}] "
  level:
    dev.racelab: INFO
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

---
spring:
  config:
    activate:
      on-profile: docker
logging:
  structured:
    format:
      console: logstash
