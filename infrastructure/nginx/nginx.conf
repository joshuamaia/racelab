# RaceLab frontend — Nginx configuration.
# Canonical copy: frontend/nginx/default.conf (used by frontend/Dockerfile, build context ./frontend).
# infrastructure/nginx/nginx.conf is the same file, kept for documentation / infrastructure reference.

map $http_x_correlation_id $rl_correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64k;
    server_tokens off;

    # ---- security headers ----------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- compression ---------------------------------------------------------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml font/woff2;

    # ---- Server-Sent Events (must be declared before the generic /api/ block) ----
    location ~ ^/api/experiments/[^/]+/events$ {
        proxy_pass http://racelab-bff:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $rl_correlation_id;
        proxy_set_header X-RaceLab-Instance $http_x_racelab_instance;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_set_header Accept $http_accept;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-cache" always;
    }

    # ---- REST API → NestJS BFF ------------------------------------------------
    location /api/ {
        proxy_pass http://racelab-bff:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $rl_correlation_id;
        proxy_set_header X-RaceLab-Instance $http_x_racelab_instance;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_read_timeout 120s;
    }

    # ---- static assets ---------------------------------------------------------
    # Hashed bundles (main-XXXX.js, chunk-XXXX.js, styles-XXXX.css) are immutable.
    location ~* "^/[^/]+-[A-Z0-9]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- SPA fallback -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
