<div class="app-shell" [class.collapsed]="collapsed()" [class.mobile-open]="mobileOpen()">
  <header class="app-topbar">
    <p-button
      icon="pi pi-bars"
      [text]="true"
      severity="secondary"
      (onClick)="toggleSidebar()"
      [ariaLabel]="collapsed() ? 'Expand menu' : 'Collapse menu'"
      pTooltip="Toggle menu"
      tooltipPosition="bottom"
    />
    <a class="brand" routerLink="/dashboard" aria-label="RaceLab home">
      <img src="favicon.svg" width="26" height="26" alt="" />
      <span class="brand-name">Race<span>Lab</span></span>
      <span class="brand-slogan">Understand concurrency. Prevent inconsistency.</span>
    </a>
    <span class="topbar-spacer"></span>

    @if (instances.runningExperiments() > 0) {
      <a class="pill tone-info" routerLink="/inspector" pTooltip="Experiments currently running on the backend" tooltipPosition="bottom">
        <i class="pi pi-spin pi-cog" aria-hidden="true"></i>
        <span>{{ instances.runningExperiments() }} running</span>
      </a>
    } @else {
      <span class="pill tone-neutral hide-mobile" pTooltip="No experiment running on the backend" tooltipPosition="bottom">
        <i class="pi pi-pause" aria-hidden="true"></i><span>idle</span>
      </span>
    }

    <span
      class="pill"
      [class]="'pill tone-' + statusChip().tone"
      [pTooltip]="statusChip().tip"
      tooltipPosition="bottom"
      role="status"
      [attr.aria-label]="'Backend status: ' + statusChip().text"
    >
      <i [class]="statusChip().icon" aria-hidden="true"></i>
      <span>{{ statusChip().text }}</span>
    </span>

    <p-button
      [icon]="prefs.theme() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"
      [text]="true"
      severity="secondary"
      (onClick)="prefs.toggleTheme()"
      [ariaLabel]="prefs.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      [pTooltip]="prefs.theme() === 'dark' ? 'Light theme' : 'Dark theme'"
      tooltipPosition="bottom"
    />
  </header>

  <nav class="app-sidebar" aria-label="Main navigation">
    @for (item of nav; track item.route) {
      @if (item.section) {
        <div class="nav-section">{{ item.section }}</div>
      }
      <a
        class="nav-link"
        [routerLink]="item.route"
        routerLinkActive="active"
        [attr.aria-label]="item.label"
        [pTooltip]="collapsed() ? item.label : ''"
        tooltipPosition="right"
      >
        <i [class]="item.icon" aria-hidden="true"></i>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>
  <div class="sidebar-backdrop" (click)="mobileOpen.set(false)" aria-hidden="true"></div>

  <main class="app-main" id="main">
    <router-outlet />
  </main>
</div>

<p-toast position="bottom-right" />
<p-confirmdialog />
